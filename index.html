<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>

    <script>
        fetch("/demo/header.html")
        .then(res => res.text())
        .then(html => document.head.insertAdjacentHTML("beforeend", html));
    </script>
</head>

<body>

    <h2>ログイン</h2>

    <form id="loginForm" onsubmit="return false;"></form>
        <div>
            <label>ユーザーID：</label>
            <input type="text" id="userid">
        </div>

        <div>
            <label>パスワード：</label>
            <input type="password" id="password">
        </div>

        <button id="loginBtn">ログイン</button>
    </form>

    <script src="/demo/js/index.js"></script>

</body>

</html>
